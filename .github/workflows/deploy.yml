# .github/workflows/deploy.yml

name: Deploy FastAPI App

on:
  push:
    branches:
      - main # Trigger this workflow when code is pushed to the 'main' branch

jobs:
  deploy:
    runs-on: ubuntu-latest # Use the latest Ubuntu runner provided by GitHub Actions

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # Action to checkout your code from your GitHub repository

      - name: Build Docker Image
        # This step builds your FastAPI application's Docker image.
        # The image is tagged as 'fastapi-app:latest' for easy reference.
        run: docker build -t fastapi-app:latest .

      - name: Deploy to Remote Server
        # This step uses the 'appleboy/ssh-action' to connect to your remote server
        # via SSH and execute commands to deploy your application.
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}       # Your server's IP address (from GitHub Secrets)
          username: ${{ secrets.SSH_USERNAME }} # SSH username for your server (from GitHub Secrets)
          key: ${{ secrets.SSH_PRIVATE_KEY }}   # SSH private key for authentication (from GitHub Secrets)
          port: 22                            # Standard SSH port, change if your server uses a different one
          script: |
            # Define the path on the host server where the persistent application data (like SQLite DB) will be stored.
            # This directory will hold your 'sql_app.db' file.
            APP_DATA_DIR="/var/lib/fastapi_app_data" 
            sudo su
            echo "Stopping existing container (if any)..."
            # Stop the old container gracefully. '|| true' ensures the command doesn't fail
            # the script if the container doesn't exist (e.g., on first deploy).
            docker stop fastapi-app-container || true 
            
            echo "Removing existing container (if any)..."
            # Remove the old container. '|| true' ensures the command doesn't fail.
            docker rm fastapi-app-container || true

            echo "Ensuring data directory exists on host: $APP_DATA_DIR"
            # Create the persistent data directory on the host server if it doesn't already exist.
            # The '-p' flag creates parent directories as needed and prevents errors if the directory exists.
            mkdir -p $APP_DATA_DIR

            echo "Running the new container with persistent volume..."
            # Run the new Docker container in detached mode (-d).
            # --name: Assigns a name to the container for easy management.
            # -p: Maps the application's port from the container to the host.
            # -v: Mounts the persistent volume.
            #     Left side ($APP_DATA_DIR): The path on your remote server's host filesystem.
            #     Right side (:/app/data): The path *inside your Docker container* where the app expects its data.
            docker run -d \
              --name fastapi-app-container \
              -p ${{ secrets.APP_PORT }}:${{ secrets.APP_PORT }} \
              -v $APP_DATA_DIR:/app/data \
              fastapi-app:latest

            echo "Deployment script finished."